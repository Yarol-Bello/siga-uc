<!-- Overlay para móvil (se muestra cuando el sidebar está abierto) -->
<div class="sidebar-overlay" [class.open]="sidebarAbierto()" (click)="cerrarSidebar()"></div>

<!-- Sidebar principal -->
<aside class="sidebar" [class.open]="sidebarAbierto()">
  <!-- Botón de cerrar (solo visible en móvil) -->
  <button class="sidebar-close-btn" (click)="cerrarSidebar()" aria-label="Cerrar menú">
    <i class="fa-solid fa-xmark"></i>
  </button>

  <div>
    <!-- BRAND -->
    <div class="sidebar-brand">
      <div class="sidebar-logo-icon">UC</div>
      <div>
        <h3>SIGA-UC</h3>
        <p>Panel de Administración</p>
      </div>
    </div>

    <!-- MENÚ -->
    <ul class="sidebar-menu">
      @for (item of menuItems; track item.path) {
      <li>
        <a [routerLink]="item.path" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/admin' }" (click)="cerrarSidebar()">
          <i class="fa-solid" [ngClass]="item.icon"></i>
          {{ item.label }}
        </a>
      </li>
      }
    </ul>
  </div>

  <!-- USUARIO Y LOGOUT -->
  <div class="sidebar-user">
    <div class="user-info">
      <p>{{ usuario()?.nombre_completo || 'Usuario' }}</p>
      <span>{{ usuario()?.rol || 'Cargando...' }}</span>
    </div>
    <i class="fa-solid fa-right-from-bracket user-logout" (click)="logout()" title="Cerrar Sesión"></i>
  </div>
</aside>
