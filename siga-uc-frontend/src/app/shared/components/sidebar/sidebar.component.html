<aside class="sidebar">
  <div>
    <!-- BRAND -->
    <div class="sidebar-brand">
      <div class="sidebar-logo-icon">UC</div>
      <div>
        <h3>SIGA-UC</h3>
        <p>Panel de Administración</p>
      </div>
    </div>

    <!-- MENÚ -->
    <ul class="sidebar-menu">
      @for (item of menuItems; track item.path) {
      <li>
        <a [routerLink]="item.path" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/admin' }">
          <i class="fa-solid" [ngClass]="item.icon"></i>
          {{ item.label }}
        </a>
      </li>
      }
    </ul>
  </div>

  <!-- USUARIO Y LOGOUT -->
  <div class="sidebar-user">
    <div class="user-info">
      <p>{{ usuario()?.nombre_completo || 'Usuario' }}</p>
      <span>{{ usuario()?.rol || 'Cargando...' }}</span>
    </div>
    <button type="button" class="user-logout" (click)="logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
      <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
    </button>
  </div>
</aside>
