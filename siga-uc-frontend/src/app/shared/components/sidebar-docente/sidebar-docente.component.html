<aside class="sidebar">
  <div>
    <div class="sidebar-brand">
      <div class="sidebar-logo-icon">UC</div>
      <div>
        <h3>SIGA-UC</h3>
        <p>Panel Docente</p>
      </div>
    </div>

    <ul class="sidebar-menu">
      @for (item of menuItems; track item.path) {
      <li>
        <a [routerLink]="item.path" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/docente' }">
          <i class="fa-solid" [ngClass]="item.icon"></i>
          {{ item.label }}
        </a>
      </li>
      }
    </ul>
  </div>

  <div class="sidebar-user">
    <div class="user-info">
      <p>{{ usuario()?.nombre_completo || 'Docente' }}</p>
      <span>Docente de Área</span>
    </div>
    <i class="fa-solid fa-right-from-bracket user-logout" (click)="logout()" title="Cerrar Sesión"></i>
  </div>
</aside>
