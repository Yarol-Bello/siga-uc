<aside class="sidebar" id="sidebarSecretaria" [class.sidebar-abierto]="abierto">
  <div>
    <div class="sidebar-brand">
      <div class="sidebar-logo-icon">UC</div>
      <div>
        <h3>SIGA-UC</h3>
        <p>Módulo Operativo</p>
      </div>
      <button type="button" class="sidebar-close" (click)="cerrar.emit()" aria-label="Cerrar menú">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <ul class="sidebar-menu">
      @for (item of menuItems; track item.path) {
      <li>
        <a [routerLink]="item.path" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/secretaria' }">
          <i class="fa-solid" [ngClass]="item.icon"></i>
          {{ item.label }}
        </a>
      </li>
      }
    </ul>
  </div>

  <div class="sidebar-user">
    <div class="user-info">
      <p>{{ usuario()?.nombre_completo || 'Secretaría' }}</p>
      <span>Secretaría / Tesorería</span>
    </div>
    <button type="button" class="user-logout" (click)="logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
      <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
    </button>
  </div>
</aside>
