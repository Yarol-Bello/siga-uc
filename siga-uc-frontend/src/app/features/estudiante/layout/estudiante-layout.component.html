<div class="admin-layout" [class.sidebar-abierto]="sidebarAbierto()">
  <app-sidebar-estudiante
    [abierto]="sidebarAbierto()"
    (cerrar)="cerrarSidebar()"
  ></app-sidebar-estudiante>

  @if (sidebarAbierto()) {
  <button
    type="button"
    class="sidebar-overlay"
    aria-label="Cerrar menú de navegación"
    (click)="cerrarSidebar()"
  ></button>
  }

  <main class="main-content">
    <app-header
      [titulo]="tituloHeader()"
      [subtitulo]="subtituloHeader()"
      [mostrarMenu]="true"
      [menuAbierto]="sidebarAbierto()"
      menuId="sidebarEstudiante"
      (menuClick)="abrirSidebar()"
    ></app-header>

    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
