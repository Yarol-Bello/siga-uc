<div class="admin-layout" [class.sidebar-abierto]="sidebarAbierto()">
  <!-- SIDEBAR -->
  <app-sidebar
    [rol]="usuario()?.rol || 'ADMIN'"
    [abierto]="sidebarAbierto()"
    (cerrar)="cerrarSidebar()"
  ></app-sidebar>

  @if (sidebarAbierto()) {
  <button
    type="button"
    class="sidebar-overlay"
    aria-label="Cerrar menú de navegación"
    (click)="cerrarSidebar()"
  ></button>
  }

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="main-content">
    <!-- HEADER -->
    <app-header
      [titulo]="titulo()"
      [subtitulo]="nombreInstitucion() + ' - Panel Directivo Central'"
      [mostrarMenu]="true"
      [menuAbierto]="sidebarAbierto()"
      menuId="sidebarAdmin"
      (menuClick)="abrirSidebar()"
    ></app-header>

    <!-- CONTENIDO DINÁMICO (según la ruta) -->
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
