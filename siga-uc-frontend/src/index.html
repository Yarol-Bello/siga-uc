<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SIGA-UC</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root>
    <style>
      .siga-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8fafc;
        color: #1e293b;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .siga-splash__logo {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #800020;
        color: #ffffff;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        box-shadow: 0 10px 25px rgba(128, 0, 32, 0.2);
      }
      .siga-splash__title {
        font-size: 1.15rem;
        font-weight: 800;
        color: #800020;
        letter-spacing: 0.04em;
      }
      .siga-splash__text {
        margin: 0;
        font-size: 0.9rem;
        color: #64748b;
      }
      .siga-splash__spinner {
        width: 22px;
        height: 22px;
        margin-top: 4px;
        border: 3px solid #e2e8f0;
        border-top-color: #800020;
        border-radius: 50%;
        animation: siga-splash-spin 0.8s linear infinite;
      }
      @keyframes siga-splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .siga-splash__spinner { animation-duration: 2s; }
      }
    </style>
    <div class="siga-splash" role="status" aria-live="polite" aria-label="Cargando SIGA-UC">
      <div class="siga-splash__logo" aria-hidden="true">UC</div>
      <div class="siga-splash__title">SIGA-UC</div>
      <p class="siga-splash__text">Cargando el sistema...</p>
      <div class="siga-splash__spinner" aria-hidden="true"></div>
    </div>
  </app-root>
  <noscript>Activa JavaScript para usar SIGA-UC.</noscript>
</body>
</html>
